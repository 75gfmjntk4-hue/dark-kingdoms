<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dark Kingdoms</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090705;color:#f2e6cd;font-family:Georgia,serif}
button{font:inherit}
#app{width:100%;height:100%;min-height:100svh;display:flex;flex-direction:column;background:
radial-gradient(ellipse at 50% 38%,#49351e 0,#21170e 38%,#090705 78%);position:relative}
header{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
background:#090705ee;border-bottom:1px solid #8a6835;z-index:3}
.logo{font-weight:900;letter-spacing:1.8px;color:#e1bb6b;font-size:18px;text-shadow:0 1px 8px #000}
.round{font:12px Arial;color:#bcae95;text-align:center}.round strong{color:#e1bb6b}
.score{font:bold 18px Arial;color:#e7d8bd}.score .you{color:#e1bb6b}
#board{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:7px;overflow:hidden}
.side{flex:1;min-height:0;border:1px solid #71552f;border-radius:9px;background:#17110bd9;
padding:5px 5px 5px 42px;position:relative;box-shadow:inset 0 0 35px #0006}
.side:before{position:absolute;left:9px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
font:10px Arial;letter-spacing:2px;color:#a89472}.enemy:before{content:"ВОРОГ"}.player:before{content:"ТИ"}
.lane{height:33.33%;min-height:0;border-bottom:1px solid #ffffff12;display:flex;align-items:center;gap:4px}
.lane:last-child{border:0}.laneName{width:40px;flex:none;text-align:center;color:#a49479;font:9px Arial;line-height:11px}
.cards{display:flex;gap:4px;overflow:hidden;align-items:center;min-width:0;min-height:0}
.card{width:59px;height:77px;flex:0 0 59px;border:1px solid #9b743a;border-radius:6px;background:
linear-gradient(145deg,#5b452a,#21170e);position:relative;padding:3px;box-shadow:0 3px 8px #0009;
overflow:hidden}.card .power{font:bold 15px Arial;color:#fff}.card .art{height:34px;display:flex;align-items:center;justify-content:center;
font-size:25px;filter:drop-shadow(0 2px 2px #000)}.card .name{font:bold 8px Arial;text-align:center;color:#f0dfbf;white-space:nowrap;overflow:hidden}
.card .ability{font:7px Arial;color:#cdbb9c;text-align:center;line-height:8px;margin-top:2px}
.card .type{position:absolute;right:3px;top:2px;font:8px Arial;color:#e1bb6b}
.handbar{height:190px;flex:none;background:#090705f5;border-top:1px solid #8a6835;padding:6px 7px calc(7px + env(safe-area-inset-bottom));
display:flex;flex-direction:column;z-index:3}.status{height:27px;display:flex;align-items:center;justify-content:space-between;
font:11px Arial;color:#cfc0a5}.status b{color:#e1bb6b}.hand{flex:1;min-height:0;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
align-items:flex-start;padding:4px 2px 7px;scrollbar-width:none}.hand::-webkit-scrollbar{display:none}
.hand .card{width:69px;height:99px;flex-basis:69px;cursor:pointer;border-width:2px}.hand .card .power{font-size:18px}.hand .card .art{height:43px;font-size:31px}
.hand .card .name{font-size:9px}.hand .card .ability{font-size:8px;line-height:9px}.hand .card:active{transform:translateY(-4px);border-color:#f1cf78}
.actions{height:35px;display:flex;gap:7px}.btn{flex:1;border:1px solid #9c753b;border-radius:6px;background:#3b2a19;color:#efd39a;
font:bold 13px Arial}.btn:active{background:#5a4023}.btn:disabled{opacity:.45}
.overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{width:min(390px,94vw);background:linear-gradient(#2a1e12,#120d09);border:1px solid #a77d3d;border-radius:12px;
padding:22px;text-align:center;box-shadow:0 18px 70px #000}.modal h1{margin:0 0 8px;color:#e3bc6d;font-size:28px}
.modal p{font:13px Arial;color:#cfc0a5;line-height:1.5}.modal button{border:1px solid #a77d3d;background:#49341e;color:#efd39a;
padding:12px 26px;border-radius:6px;font-weight:bold}
#menu{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#49351e,#0b0806 70%);z-index:30;
display:flex;align-items:center;justify-content:center;padding:20px}.menuBox{text-align:center;width:min(430px,95vw)}
.menuBox h1{font-size:42px;letter-spacing:3px;color:#e2bb6c;margin:0 0 4px}.menuBox .sub{font:12px Arial;color:#a99a80;letter-spacing:3px;margin-bottom:30px}
.menuBtns{display:grid;gap:10px}.menuBtn{height:52px;border:1px solid #a67b3d;background:#332417;color:#efd39a;border-radius:7px;font-weight:bold}
.menuBtn.primary{background:#574021}.small{font:10px Arial;color:#756a59;margin-top:18px}
@media(min-width:800px){#board{max-width:1050px;width:100%;margin:auto}.side{min-height:175px}.card{width:70px;height:91px;flex-basis:70px}.handbar{height:205px}.hand .card{width:78px;height:110px;flex-basis:78px}}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">DARK KINGDOMS</div><div class="round" id="round">Раунд <strong>1</strong> / 3</div><div class="score">☠ <span id="es">0</span> : <span class="you" id="ps">0</span></div></header>
<main id="board">
<section class="side enemy"><div class="lane"><div class="laneName">✨<br>МАГІЯ</div><div class="cards" id="emagic"></div></div>
<div class="lane"><div class="laneName">🏹<br>ДАЛЬНІ</div><div class="cards" id="eranged"></div></div>
<div class="lane"><div class="laneName">⚔️<br>БЛИЖНІ</div><div class="cards" id="emelee"></div></div></section>
<section class="side player"><div class="lane"><div class="laneName">⚔️<br>БЛИЖНІ</div><div class="cards" id="pmelee"></div></div>
<div class="lane"><div class="laneName">🏹<br>ДАЛЬНІ</div><div class="cards" id="pranged"></div></div>
<div class="lane"><div class="laneName">✨<br>МАГІЯ</div><div class="cards" id="pmagic"></div></div></section>
</main>
<div class="handbar"><div class="status"><span id="msg">Твій хід</span><span>Карти: <b id="hc">10</b></span></div>
<div class="hand" id="hand"></div><div class="actions"><button class="btn" id="pass">ПАС</button><button class="btn" id="restart">НОВА ГРА</button></div></div>
</div>

<div class="overlay" id="resultBox"><div class="modal"><h1 id="result"></h1><p id="detail"></p><button id="again">ГРАТИ ЩЕ</button></div></div>
<div id="menu"><div class="menuBox"><h1>DARK KINGDOMS</h1><div class="sub">КАРТОВА БИТВА</div>
<div class="menuBtns"><button class="menuBtn primary" id="startBtn">ПОЧАТИ БИТВУ</button>
<button class="menuBtn" id="quickBtn">ШВИДКИЙ БІЙ</button></div>
<div class="small">Прототип HTML5 · 100% у браузері · без завантажень</div></div></div>

<script>
"use strict";
const CARDS=[
{name:"Вовк",p:4,r:"melee",i:"🐺",a:""}, {name:"Вартовий",p:5,r:"melee",i:"🛡️",a:""},
{name:"Берсерк",p:7,r:"melee",i:"🪓",a:""}, {name:"Лицар",p:6,r:"melee",i:"⚔️",a:""},
{name:"Мисливець",p:4,r:"ranged",i:"🏹",a:""}, {name:"Арбалетник",p:6,r:"ranged",i:"🎯",a:""},
{name:"Слідопит",p:5,r:"ranged",i:"🦅",a:""}, {name:"Тінь",p:5,r:"ranged",i:"🥷",a:""},
{name:"Відьма",p:5,r:"magic",i:"🧙",a:""}, {name:"Некромант",p:6,r:"magic",i:"💀",a:""},
{name:"Вогнемант",p:7,r:"magic",i:"🔥",a:""}, {name:"Друїд",p:4,r:"magic",i:"🌿",a:""}
];
let hand=[],enemyHand=[],played=[],enemyPlayed=[],round=1,youRounds=0,enemyRounds=0,passed=false,enemyPassed=false,busy=false;

const $=id=>document.getElementById(id);
function clone(c){return {...c,id:Math.random().toString(36).slice(2)}}
function deck(){let d=[];for(let k=0;k<2;k++)CARDS.forEach(c=>d.push(clone(c)));return d.sort(()=>Math.random()-.5)}
function total(a){return a.reduce((s,c)=>s+c.p,0)}
function cardHTML(c,clickable){
const icon=c.r==="melee"?"⚔️":c.r==="ranged"?"🏹":"✨";
return '<div class="card" '+(clickable?'data-id="'+c.id+'"':'')+'><div class="power">'+c.p+'</div><div class="type">'+icon+'</div><div class="art">'+c.i+'</div><div class="name">'+c.name+'</div><div class="ability">'+c.a+'</div></div>';
}
function render(){
$("hand").innerHTML=hand.map(c=>cardHTML(c,!busy&&!passed)).join("");
$("hc").textContent=hand.length;
["melee","ranged","magic"].forEach(r=>{
$("p"+r).innerHTML=played.filter(c=>c.r===r).map(c=>cardHTML(c,false)).join("");
$("e"+r).innerHTML=enemyPlayed.filter(c=>c.r===r).map(c=>cardHTML(c,false)).join("");
});
$("ps").textContent=total(played);$("es").textContent=total(enemyPlayed);
$("round").innerHTML="Раунд <strong>"+round+"</strong> / 3";
$("pass").disabled=busy||passed;
}
$("hand").addEventListener("click",e=>{
const el=e.target.closest(".card");if(!el||busy||passed)return;
const id=el.dataset.id,i=hand.findIndex(c=>c.id===id);if(i<0)return;
played.push(hand.splice(i,1)[0]);busy=true;$("msg").textContent="Ворог думає…";render();setTimeout(enemyTurn,500);
});
function enemyTurn(){
if(enemyPassed||enemyHand.length===0){enemyPassed=true;busy=false;render();checkEnd();return}
const ps=total(played),es=total(enemyPlayed);
let shouldPass=(enemyPlayed.length>=5&&es>=ps+5)||(passed&&es>=ps);
if(shouldPass){enemyPassed=true;busy=false;$("msg").textContent="Ворог пасує.";render();checkEnd();return}
let target;
if(ps>es+4) target=enemyHand.slice().sort((a,b)=>b.p-a.p)[0];
else target=enemyHand[Math.floor(Math.random()*enemyHand.length)];
enemyHand.splice(enemyHand.indexOf(target),1);enemyPlayed.push(target);
busy=false;$("msg").textContent=passed?"Ворог продовжує…":"Твій хід";render();checkEnd();
}
function pass(){
if(busy||passed)return;passed=true;$("msg").textContent="Ти пасуєш.";render();
if(enemyPassed)checkEnd();else setTimeout(enemyTurn,400);
}
function checkEnd(){if((passed&&enemyPassed)||(hand.length===0&&enemyHand.length===0))setTimeout(endRound,450)}
function endRound(){
const a=total(played),b=total(enemyPlayed);
if(a>b)youRounds++;else if(b>a)enemyRounds++;
render();
if(youRounds>=2||enemyRounds>=2||round>=3){
$("result").textContent=youRounds>enemyRounds?"🏆 ПЕРЕМОГА":"☠ ПОРАЗКА";
$("detail").textContent="Раунди: "+youRounds+" : "+enemyRounds+" · Сила останнього раунду: "+a+" : "+b;
$("resultBox").style.display="flex";return;
}
round++;played=[];enemyPlayed=[];passed=false;enemyPassed=false;busy=false;
hand=deck().slice(0,10);enemyHand=deck().slice(0,10);$("msg").textContent="Новий раунд — твій хід";render();
}
function startGame(){
$("menu").style.display="none";$("resultBox").style.display="none";round=1;youRounds=0;enemyRounds=0;played=[];enemyPlayed=[];
passed=false;enemyPassed=false;busy=false;hand=deck().slice(0,10);enemyHand=deck().slice(0,10);
$("msg").textContent="Твій хід — обери карту";render();
}
$("pass").onclick=pass;$("restart").onclick=startGame;$("again").onclick=startGame;$("startBtn").onclick=startGame;$("quickBtn").onclick=startGame;
</script>
</body>
</html>
