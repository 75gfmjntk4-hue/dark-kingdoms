<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dark Kingdoms</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080604;color:#f4e6ca;font-family:Georgia,serif}
body{touch-action:manipulation}
button{font:inherit}
#app{height:100%;min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden;
background:radial-gradient(ellipse at 50% 42%,#604520 0,#2a1b10 34%,#0a0705 78%)}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#board:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#0008 100%);z-index:0}
#board>.side{z-index:1}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#d6ad5f;opacity:0;animation:float 4s linear infinite}
@keyframes float{0%{transform:translateY(20px) scale(.5);opacity:0}20%{opacity:.55}80%{opacity:.25}100%{transform:translateY(-110px) scale(1);opacity:0}}
header{height:55px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 11px;background:#090705ed;
border-bottom:1px solid #92703a;z-index:5}.logo{font-weight:900;letter-spacing:1.8px;color:#e4bd6d;font-size:18px;text-shadow:0 0 12px #b8863b55}
.round{font:11px Arial;color:#b8aa93;text-align:center}.round b{color:#e2ba68}.score{font:bold 18px Arial}.score .you{color:#e5bc69}
#board{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 8px 6px;z-index:2;overflow:hidden;background:url('board_texture.jpg') center/100% 100% no-repeat;position:relative}
.side{flex:1;min-height:0;border:1px solid #8a683488;border-radius:11px;background:linear-gradient(180deg,#08060455,#08060466);padding:5px 7px 5px 58px;position:relative;box-shadow:inset 0 0 45px #0009,0 0 18px #0006;overflow:hidden}
.side:before{position:absolute;left:10px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font:11px Arial;letter-spacing:3px;color:#e0c78f;text-shadow:0 2px 5px #000}.enemy:before{content:"ВОРОГ"}.player:before{content:"ТИ"}
.lane{height:33.33%;min-height:0;border-bottom:1px solid #d6b77c22;display:flex;align-items:center;gap:7px;overflow:hidden}.lane:last-child{border:0}
.laneName{width:46px;flex:none;text-align:center;color:#b5a382;font:10px Arial;line-height:13px;text-shadow:0 1px 4px #000}
.cards{flex:1;min-width:0;height:100%;display:flex;flex-wrap:wrap;gap:5px;align-content:center;align-items:center;overflow:hidden}
.card{width:82px;height:98px;aspect-ratio:416/496;flex:0 0 82px;border:1px solid #9a7540;border-radius:7px;background:#080604;position:relative;overflow:hidden;box-shadow:0 5px 14px #000d;transition:transform .16s,filter .16s,box-shadow .16s}
.card:before{content:"";position:absolute;inset:0;border:1px solid #d6b77c88;border-radius:7px;z-index:5;pointer-events:none;box-shadow:inset 0 0 10px #0008}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#fff2 0,transparent 15%,transparent 70%,#0004 100%);pointer-events:none;z-index:4}
.card .art{position:absolute;inset:0;z-index:1;overflow:hidden;border-radius:6px;background:#080604}.card .art img{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:fill!important;object-position:center!important;border-radius:6px!important;margin:0!important;padding:0!important}
.card .power,.card .type,.card .name,.card .class,.card .ability,.card .stats{display:none}.playedIn{animation:land .35s ease-out}.enemyPlayedIn{animation:landEnemy .35s ease-out}
@keyframes land{0%{transform:translateY(22px) scale(.72) rotate(-4deg);opacity:0}70%{transform:translateY(-3px) scale(1.03)}100%{transform:none;opacity:1}}@keyframes landEnemy{0%{transform:translateY(-22px) scale(.72) rotate(4deg);opacity:0}70%{transform:translateY(3px) scale(1.03)}100%{transform:none;opacity:1}}
.handbar{height:212px;flex:none;background:#080604f7;border-top:1px solid #92703a;padding:6px 7px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:column;z-index:5}.status{height:28px;display:flex;align-items:center;justify-content:space-between;font:11px Arial;color:#d1c0a1}.status b{color:#e1ba68}.hand{flex:1;min-height:0;display:flex;gap:7px;overflow-x:auto;align-items:center;padding:4px 2px 7px;scrollbar-width:none}.hand::-webkit-scrollbar{display:none}
.hand .card{width:104px;height:124px;aspect-ratio:416/496;flex:0 0 104px;cursor:pointer}.hand .card:active{transform:translateY(-8px) scale(1.03);border-color:#f2ce76;box-shadow:0 10px 22px #000}
.actions{height:35px;display:flex;gap:7px}.btn{flex:1;border:1px solid #a17a3f;border-radius:6px;background:#3b2a19;color:#efd39a;font:bold 13px Arial}.btn:active{background:#624525;transform:translateY(1px)}.btn:disabled{opacity:.42}
#board:before{content:'';position:absolute;inset:2px;border:1px solid #c19a55aa;box-shadow:inset 0 0 30px #000b;pointer-events:none;z-index:0;border-radius:10px}
#sound{position:absolute;right:8px;top:59px;z-index:8;border:1px solid #6f542e;border-radius:50%;background:#160f09cc;color:#dfba6d;width:31px;height:31px}
.overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{width:min(390px,94vw);background:linear-gradient(#2b1f12,#110c08);border:1px solid #aa7e3f;border-radius:12px;padding:23px;text-align:center;
box-shadow:0 18px 70px #000}.modal h1{margin:0 0 8px;color:#e5bd6c;font-size:29px}.modal p{font:13px Arial;color:#d1c0a3;line-height:1.5}
.modal button{border:1px solid #ad803e;background:#49341e;color:#efd39a;padding:12px 26px;border-radius:6px;font-weight:bold}
#menu{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#5a401f,#0b0806 70%);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.menuBox{text-align:center;width:min(430px,95vw)}.menuBox h1{font-size:42px;letter-spacing:3px;color:#e2bb6c;margin:0 0 5px;text-shadow:0 0 22px #c18c3b66}
.menuBox .sub{font:12px Arial;color:#a99a80;letter-spacing:3px;margin-bottom:30px}.menuBtns{display:grid;gap:10px}
.menuBtn{height:52px;border:1px solid #a67b3d;background:#332417;color:#efd39a;border-radius:7px;font-weight:bold}
.menuBtn.primary{background:#574021}.small{font:10px Arial;color:#756a59;margin-top:18px}
.shake{animation:shake .22s ease-in-out 2}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.flash{animation:flash .32s ease-out}@keyframes flash{0%{filter:brightness(2.5)}100%{filter:brightness(1)}}
@media(min-width:800px){#board{max-width:1050px;width:100%;margin:auto}.side{min-height:175px}.card{width:88px;height:105px;flex-basis:88px}.handbar{height:220px}.hand .card{width:108px;height:129px;flex-basis:108px}}
@media(max-width:430px){.side{padding-left:54px}.laneName{width:42px;font-size:9px}.cards{gap:4px}.card{width:76px;height:91px;flex-basis:76px}.hand .card{width:101px;height:121px;flex-basis:101px}}
</style>
</head>
<body>
<div id="app"><div id="particles"></div>
<header><div class="logo">DARK KINGDOMS</div><div class="round" id="round">Раунд <b>1</b> / 3</div><div class="score">☠ <span id="es">0</span> : <span class="you" id="ps">0</span></div></header>
<button id="sound" aria-label="Звук">🔊</button>
<main id="board">
<section class="side enemy"><div class="lane"><div class="laneName">✨<br>МАГІЯ</div><div class="cards" id="emagic"></div></div>
<div class="lane"><div class="laneName">🏹<br>ДАЛЬНІ</div><div class="cards" id="eranged"></div></div>
<div class="lane"><div class="laneName">⚔️<br>БЛИЖНІ</div><div class="cards" id="emelee"></div></div></section>
<section class="side player"><div class="lane"><div class="laneName">⚔️<br>БЛИЖНІ</div><div class="cards" id="pmelee"></div></div>
<div class="lane"><div class="laneName">🏹<br>ДАЛЬНІ</div><div class="cards" id="pranged"></div></div>
<div class="lane"><div class="laneName">✨<br>МАГІЯ</div><div class="cards" id="pmagic"></div></div></section>
</main>
<div class="handbar"><div class="status"><span id="msg">Твій хід — обери карту</span><span>Карти: <b id="hc">10</b></span></div>
<div class="hand" id="hand"></div><div class="actions"><button class="btn" id="pass">ПАС</button><button class="btn" id="restart">НОВА ГРА</button></div></div>
</div>

<div class="overlay" id="resultBox"><div class="modal"><h1 id="result"></h1><p id="detail"></p><button id="again">ГРАТИ ЩЕ</button></div></div>
<div id="menu"><div class="menuBox"><h1>DARK KINGDOMS</h1><div class="sub">КАРТОВА БИТВА</div>
<div class="menuBtns"><button class="menuBtn primary" id="startBtn">⚔ ПОЧАТИ БИТВУ</button><button class="menuBtn" id="quickBtn">⚡ ШВИДКИЙ БІЙ</button></div>
<div class="small">HTML5 · мобільна версія · звук та анімації</div></div></div>

<script>
"use strict";
const CARDS=[
["Лицар Світла",5,"melee","","Людина. Воїн.","Коли ця карта виходить на поле, дає +1 сили всім союзним картам у ряду.",4,6],
["Тіньовий Мисливець",4,"ranged","","Людина.","Коли ця карта атакує, завдає +1 шкоди, ціль ослаблена.",3,4],
["Відьма з Боліт",6,"magic","","Людина. Магія.","Коли ця карта виходить на поле, накладає Отруту на випадкову ворожу карту.",4,5],
["Кривавий Звір",6,"melee","","Чудовисько.","Коли ця карта отримує шкоду, дає +2 сили.",6,6],
["Некромант",7,"magic","","Людина. Магія.","Коли ця карта виходить на поле, повертає одну випадкову карту з вашого кладовища.",4,5],
["Король Падіння",10,"melee","","Людина.","Коли ця карта виходить на поле, усі ваші карти отримують +1 сили. Ворог втрачає 1 сили.",7,8]
].map(x=>({name:x[0],p:x[1],r:x[2],i:x[3],cls:x[4],a:x[5],atk:x[6],hp:x[7]}));
let hand=[],enemyHand=[],played=[],enemyPlayed=[],round=1,youRounds=0,enemyRounds=0,passed=false,enemyPassed=false,busy=false,soundOn=true,audio=null;

const $=id=>document.getElementById(id);
function clone(c){return {...c,id:Math.random().toString(36).slice(2)}}
function deck(){let d=[];for(let k=0;k<2;k++)CARDS.forEach(c=>d.push(clone(c)));return d.sort(()=>Math.random()-.5)}
function total(a){return a.reduce((s,c)=>s+c.p,0)}
const ART={
  'Лицар Світла':'card_01_knight.jpg',
  'Тіньовий Мисливець':'card_02_hunter.jpg',
  'Відьма з Боліт':'card_03_witch.jpg',
  'Кривавий Звір':'card_04_beast.jpg',
  'Некромант':'card_05_necromancer.jpg',
  'Король Падіння':'card_06_fallen_king.jpg'
};

function cardHTML(c,clickable,playedClass=""){
const src=ART[c.name];
return '<div class="card '+playedClass+'" '+(clickable?'data-id="'+c.id+'"':'')+'><div class="art"><img src="'+src+'" alt="'+c.name+'"></div></div>';
}
function render(){
$("hand").innerHTML=hand.map(c=>cardHTML(c,!busy&&!passed)).join("");$("hc").textContent=hand.length;
["melee","ranged","magic"].forEach(r=>{
$("p"+r).innerHTML=played.filter(x=>x.r===r).map(x=>cardHTML(x,false,"playedIn")).join("");
$("e"+r).innerHTML=enemyPlayed.filter(x=>x.r===r).map(x=>cardHTML(x,false,"enemyPlayedIn")).join("");
});
$("ps").textContent=total(played);$("es").textContent=total(enemyPlayed);$("round").innerHTML="Раунд <b>"+round+"</b> / 3";
$("pass").disabled=busy||passed;
}
function tone(freq,dur,type="sine",gain=.045){
if(!soundOn)return;if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;
g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
}
function playCardSound(){tone(240,.09,"triangle",.06);setTimeout(()=>tone(420,.12,"triangle",.045),45)}
function passSound(){tone(160,.18,"sine",.04)}
function winSound(){tone(440,.12,"triangle",.06);setTimeout(()=>tone(660,.18,"triangle",.06),120);setTimeout(()=>tone(880,.3,"triangle",.06),250)}
function loseSound(){tone(180,.2,"sawtooth",.025);setTimeout(()=>tone(120,.35,"sawtooth",.02),180)}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇";if(soundOn)tone(520,.08)};
$("hand").addEventListener("click",e=>{
const el=e.target.closest(".card");if(!el||busy||passed)return;const i=hand.findIndex(c=>c.id===el.dataset.id);if(i<0)return;
played.push(hand.splice(i,1)[0]);busy=true;playCardSound();$("msg").textContent="Ворог думає…";render();setTimeout(enemyTurn,500);
});
function enemyTurn(){
if(enemyPassed||enemyHand.length===0){enemyPassed=true;busy=false;render();checkEnd();return}
const ps=total(played),es=total(enemyPlayed);
if((enemyPlayed.length>=5&&es>=ps+5)||(passed&&es>=ps)){enemyPassed=true;busy=false;$("msg").textContent="Ворог пасує.";passSound();render();checkEnd();return}
let target=ps>es+4?enemyHand.slice().sort((a,b)=>b.p-a.p)[0]:enemyHand[Math.floor(Math.random()*enemyHand.length)];
enemyHand.splice(enemyHand.indexOf(target),1);enemyPlayed.push(target);tone(210,.08,"triangle",.035);
busy=false;$("msg").textContent=passed?"Ворог продовжує…":"Твій хід";render();checkEnd();
}
function pass(){if(busy||passed)return;passed=true;$("msg").textContent="Ти пасуєш.";passSound();render();setTimeout(enemyTurn,400)}
function checkEnd(){if((passed&&enemyPassed)||(hand.length===0&&enemyHand.length===0))setTimeout(endRound,500)}
function endRound(){
const a=total(played),b=total(enemyPlayed);if(a>b)youRounds++;else if(b>a)enemyRounds++;render();
if(youRounds>=2||enemyRounds>=2||round>=3){
$("result").textContent=youRounds>enemyRounds?"🏆 ПЕРЕМОГА":"☠ ПОРАЗКА";
$("detail").textContent="Раунди: "+youRounds+" : "+enemyRounds+" · Сила останнього раунду: "+a+" : "+b;
$("resultBox").style.display="flex";youRounds>enemyRounds?winSound():loseSound();return}
round++;played=[];enemyPlayed=[];passed=false;enemyPassed=false;busy=false;hand=deck().slice(0,10);enemyHand=deck().slice(0,10);
$("msg").textContent="Новий раунд — твій хід";render();tone(330,.15,"triangle",.04);
}
function startGame(){if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
$("menu").style.display="none";$("resultBox").style.display="none";round=1;youRounds=0;enemyRounds=0;played=[];enemyPlayed=[];passed=false;enemyPassed=false;busy=false;
hand=deck().slice(0,10);enemyHand=deck().slice(0,10);$("msg").textContent="Твій хід — обери карту";render();tone(520,.1,"triangle",.045)}
$("pass").onclick=pass;$("restart").onclick=startGame;$("again").onclick=startGame;$("startBtn").onclick=startGame;$("quickBtn").onclick=startGame;
for(let i=0;i<24;i++){let p=document.createElement("i");p.className="particle";p.style.left=(Math.random()*100)+"%";p.style.top=(45+Math.random()*55)+"%";p.style.animationDelay=(Math.random()*4)+"s";p.style.animationDuration=(3+Math.random()*3)+"s";$("particles").appendChild(p)}
</script>
</body></html>
